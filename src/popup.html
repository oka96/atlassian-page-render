<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        background: #ffffff;
        color: #172b4d;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-width: 260px;
        padding: 12px 14px;
      }

      .row {
        align-items: center;
        cursor: pointer;
        display: flex;
        gap: 10px;
        justify-content: space-between;
      }

      .label {
        font-weight: 600;
      }

      .switch {
        flex: 0 0 auto;
        height: 20px;
        position: relative;
        width: 36px;
      }

      .switch input {
        height: 100%;
        margin: 0;
        opacity: 0;
        position: absolute;
        width: 100%;
      }

      .slider {
        background: #c1c7d0;
        border-radius: 10px;
        inset: 0;
        pointer-events: none;
        position: absolute;
        transition: background 0.15s ease;
      }

      .slider::before {
        background: #ffffff;
        border-radius: 50%;
        content: "";
        height: 16px;
        left: 2px;
        position: absolute;
        top: 2px;
        transition: transform 0.15s ease;
        width: 16px;
      }

      .switch input:checked + .slider {
        background: #0c66e4;
      }

      .switch input:checked + .slider::before {
        transform: translateX(16px);
      }

      .hint {
        color: #44546f;
        margin: 10px 0 0;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1d2125;
          color: #dee4ea;
        }

        .hint {
          color: #b6c2cf;
        }

        .slider {
          background: #454f59;
        }
      }
    </style>
  </head>
  <body>
    <label class="row">
      <span class="label">Render PlantUML diagrams</span>
      <span class="switch">
        <input type="checkbox" id="render-toggle" />
        <span class="slider"></span>
      </span>
    </label>
    <p class="hint">
      When off, pages show the original code blocks and any inserted images -
      exactly what viewers without the extension see.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
